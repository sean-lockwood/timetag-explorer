name: Tests

# On pull requests and on main. The tests use synthetic data and need no network.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']   # the oldest supported and the newest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Everything compiles
        run: python -m compileall -q timetag_explorer validation tests

      - name: Tests
        run: |
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t" || exit 1
          done
