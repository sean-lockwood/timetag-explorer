name: Weekly checks

# Slow checks, and ones that go out on the network or change without a commit of ours. "Run workflow" starts them
# by hand. A failure emails the repository owner.
on:
  schedule:
    - cron: '41 5 * * 1'     # Mondays, early morning UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection-scripts:
    # Builds the selection scripts, runs them with the real astropy on one exposure downloaded from AWS / MAST,
    # and compares the columns they write (flags, positions, weights) with the package's own numbers (see
    # validation/check_selection_scripts.py).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . s3fs
      - name: Check the selection scripts
        # -u: unbuffered, so the log shows progress as it happens (and is complete if the job is cut off)
        run: python -u validation/check_selection_scripts.py OFAP44G5Q --timeout 900
      - name: Keep the results
        # results.csv lists every case; each failing case keeps its script, log.txt and case.txt (not the TAG file)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selection-test-results
          path: |
            selection_test/results.csv
            selection_test/runs/**/*.py
            selection_test/runs/**/log.txt
            selection_test/runs/**/case.txt
          if-no-files-found: ignore
          retention-days: 14

  audit:
    # Known security problems in the packages that the install pulls in.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install -e . pip-audit
      - run: pip-audit --skip-editable
