name: Weekly checks

# Slow checks, and ones that go out on the network or change without a commit of ours. "Run workflow" starts them
# by hand. A failure emails the repository owner.
on:
  schedule:
    - cron: '41 5 * * 1'     # Mondays, early morning UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
