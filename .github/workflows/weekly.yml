  audit:
    # Known security problems in the packages that the install pulls in.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install -e . pip-audit
      - run: pip-audit --skip-editable
