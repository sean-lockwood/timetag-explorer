name: Release to PyPI

# Publishes when a GitHub release is published. Uses PyPI "trusted publishing" (OpenID Connect): no API token is
# stored anywhere. One-time setup on PyPI: Account settings > Publishing > add a pending publisher with project
# "timetag-explorer", owner "sean-lockwood", repository "timetag-explorer", workflow "release.yml", environment "pypi".
on:
  release:
    types: [published]
  workflow_dispatch:      # builds and checks only; the publish job needs a release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: The tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n "s/^__version__ = '\(.*\)'/\1/p" timetag_explorer/__init__.py)
          echo "package version $version, release tag $TAG"
          test "v$version" = "$TAG"

      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/timetag-explorer/
    permissions:
      id-token: write       # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
